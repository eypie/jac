<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAC class 11 PYQ · simple UI</title>
    <!-- simple, nice font: system defaults + smooth clean edges -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter: modern, very readable, free font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <style>
        /* very simple, clean, airy UI */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f7f9fc;   /* soft, almost white background */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            line-height: 1.5;
            color: #1e2b3a;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: white;
            border-radius: 26px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.03), 0 4px 10px rgba(0, 0, 0, 0.02);
            padding: 2.5rem 2.2rem 3rem 2.2rem;
            transition: all 0.2s ease;
        }

        h2 {
            font-size: 1.9rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            color: #0a1c2f;
            margin-bottom: 0.4rem;
            line-height: 1.2;
            border-left: 4px solid #9bb8e0;
            padding-left: 1.3rem;
        }

        .subhead {
            font-size: 1rem;
            color: #4d6278;
            margin-bottom: 2.5rem;
            margin-top: 0.25rem;
            padding-left: 1.8rem;
            font-weight: 350;
        }

        /* clean table design */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;   /* breathing space between rows */
            margin: 0.5rem 0 0 0;
            font-size: 1.05rem;
        }

        th {
            text-align: left;
            font-weight: 500;
            color: #2c3f58;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            padding: 0.6rem 1rem 0.6rem 0;
            border-bottom: 1px solid #dde4ed;
        }

        th:first-child {
            width: 70px;      /* S. NO. column width fixed but subtle */
        }
        th:nth-child(2) {
            width: auto;      /* subject name */
        }
        th:last-child {
            width: 120px;     /* links column */
        }

        tbody tr {
            background-color: white;
            border-radius: 18px;
            transition: background 0.15s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.01);
        }

        tbody td {
            padding: 1rem 1rem 1rem 0;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* subtle row hover */
        tbody tr:hover td {
            background-color: #f9fcff;
        }

        td:first-child {
            font-weight: 450;
            color: #3b4f68;
            width: 70px;
        }

        td:nth-child(2) {
            font-weight: 450;
            color: #122c42;
        }

        /* nice simple link style */
        a {
            text-decoration: none;
            background-color: #eaf1fa;
            color: #1d4b77;
            padding: 0.45rem 1.3rem;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 500;
            display: inline-block;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
            border: 1px solid transparent;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            line-height: 1.3;
            white-space: nowrap;
        }

        a:hover {
            background-color: #d4e2f5;
            color: #0c2d4b;
            border-color: #b7cde0;
            box-shadow: 0 4px 8px rgba(0, 40, 70, 0.06);
        }

        a:active {
            background-color: #c1d4ec;
            transform: scale(0.98);
        }

        /* simple footer note (optional) */
        .footnote {
            margin-top: 2.2rem;
            font-size: 0.85rem;
            color: #7b8ba3;
            text-align: right;
            border-top: 1px dashed #cfddee;
            padding-top: 1.2rem;
        }

        /* Responsive: keep it clean on small devices */
        @media (max-width: 550px) {
            body { padding: 1rem; }
            .card { padding: 1.5rem 1.2rem; }
            h2 { font-size: 1.6rem; padding-left: 1rem; }
            .subhead { padding-left: 1.2rem; }
            th, td { font-size: 0.95rem; }
            td:nth-child(2) { white-space: normal; }
            a { padding: 0.35rem 1rem; }
        }

        /* optional: smooth rounded for first/last cell per row */
        tbody tr td:first-child {
            border-top-left-radius: 14px;
            border-bottom-left-radius: 14px;
        }
        tbody tr td:last-child {
            border-top-right-radius: 14px;
            border-bottom-right-radius: 14px;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>JAC class 11 · PYQ</h2>
    <div class="subhead">previous year questions (MCQ format)</div>

    <table>
        <thead>
            <tr>
                <th>S. NO.</th>
                <th>Subject name</th>
                <th>Links</th>
            </tr>
        </thead>
        <tbody>
            <!-- chemistry (already there) -->
            <tr>
                <td>1</td>
                <td>Chemistry</td>
                <td><a href="/jac/chem1.html">click here</a></td>
            </tr>
            <!-- biology -->
            <tr>
                <td>2</td>
                <td>Biology</td>
                <td><a href="/bio1.html">click here</a></td>
            </tr>
            <!-- physics -->
            <tr>
                <td>3</td>
                <td>Physics</td>
                <td><a href="/phy1.html">click here</a></td>
            </tr>
            <!-- computer science -->
            <tr>
                <td>4</td>
                <td>Computer Science</td>
                <td><a href="/cs1.html">click here</a></td>
            </tr>
            <!-- english -->
            <tr>
                <td>5</td>
                <td>English</td>
                <td><a href="/eng1.html">click here</a></td>
            </tr>
            <!-- just to be safe, add row for mathematics? not requested, but you can keep it minimal.
                 but we add only what's asked: chemistry, biology, physics, cs, english.   -->
            <!-- optional extra row: but we stick exactly to requested subjects -->
        </tbody>
    </table>

    <!-- very simple additional hint: all subjects, clean ui -->
    <div class="footnote">
        ⚡ MCQs · JAC board · class 11
    </div>
</div>

<!-- done: exactly 5 subjects (chem, bio, physics, CS, english) + original chemistry already included  -->
</body>
</html>
