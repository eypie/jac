<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAC Class 11 Chemistry (P2) · full 40 questions · MathJax</title>
    <!-- MathJax for clean formulas -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Times New Roman, Arial, Helvetica, sans-serif;
        }
        body {
            background: #eaf0f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .quiz-paper {
            max-width: 950px;
            width: 100%;
            background: white;
            border-radius: 40px;
            box-shadow: 0 25px 45px -15px #1d3557;
            padding: 30px 30px 40px;
            border: 1px solid #cdddec;
        }
        .header {
            border-bottom: 2px solid #1e3a5f;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .header h2 {
            color: #0b2b44;
            font-weight: 700;
            font-size: 1.9rem;
            letter-spacing: -0.5px;
        }
        .header .sub {
            display: flex;
            justify-content: space-between;
            color: #2f4858;
            font-weight: 500;
            flex-wrap: wrap;
        }
        .tracker {
            background: #dfeaf3;
            border-radius: 60px;
            padding: 14px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 18px 0 20px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .progress-bar {
            background: #b2c9e0;
            height: 10px;
            width: 60%;
            border-radius: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: #102a42;
            height: 10px;
            width: 0%;
            border-radius: 20px;
        }
        .question-block {
            background: #ffffff;
            border: 1px solid #cbd9ec;
            border-radius: 34px;
            padding: 28px 25px;
            margin: 22px 0;
            box-shadow: 0 10px 16px -10px rgba(0,40,70,0.1);
        }
        .q-text {
            font-size: 1.45rem;
            font-weight: 600;
            color: #0a1f33;
            margin-bottom: 28px;
            line-height: 1.4;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .opt-item {
            display: flex;
            align-items: center;
            gap: 18px;
            background: #f6faff;
            border: 2px solid #d6e2f0;
            border-radius: 60px;
            padding: 14px 25px;
            transition: 0.1s;
            cursor: pointer;
        }
        .opt-item.selected {
            background: #dae8fc;
            border-color: #1e3a5f;
        }
        .opt-item:hover {
            background: #e3efff;
            border-color: #7b9bc2;
        }
        input[type="radio"] {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 2px solid #446688;
            border-radius: 50%;
            position: relative;
            transition: 0.1s;
        }
        input[type="radio"]:checked {
            background-color: #102a42;
            border-color: #102a42;
            box-shadow: inset 0 0 0 5px white;
        }
        .opt-label {
            font-size: 1.2rem;
            font-weight: 500;
            color: #1c3a5c;
            flex: 1;
        }
        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            margin: 25px 0 10px;
        }
        button {
            background: white;
            border: 2px solid #bacfeb;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.15rem;
            color: #102a42;
            min-width: 135px;
            flex: 1 1 auto;
            cursor: pointer;
            transition: 0.15s;
        }
        button:hover {
            background: #dbe9fa;
            border-color: #1e3f60;
        }
        button:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .submit-btn {
            background: #102a42;
            color: white;
            border-color: #0b1c2e;
        }
        .footer {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #4f6f8f;
            text-align: right;
            border-top: 1px dashed #b8cee8;
            padding-top: 15px;
        }
        .confirm-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 30, 50, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
            z-index: 2000;
        }
        .confirm-card {
            background: white;
            border-radius: 50px;
            padding: 30px 35px;
            max-width: 390px;
            text-align: center;
            box-shadow: 0 35px 50px #102a42;
        }
        .confirm-card p {
            font-size: 1.7rem;
            font-weight: 700;
            color: #102a42;
            margin-bottom: 30px;
        }
        .confirm-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        .conf-btn {
            border: none;
            background: transparent;
            font-weight: 700;
            font-size: 1.3rem;
            padding: 15px 30px;
            border-radius: 60px;
            border: 3px solid #102a42;
        }
        .conf-yes {
            background: #102a42;
            color: white;
        }
        .conf-no {
            background: white;
            color: #102a42;
        }
        .result-area {
            text-align: center;
            padding: 35px 15px;
        }
        .result-area h2 {
            font-size: 2.7rem;
            color: #102a42;
        }
        .score-badge {
            background: #deecfb;
            border-radius: 90px;
            padding: 25px;
            font-size: 2rem;
            margin: 30px 0;
        }
        .MathJax { font-size: 1.2em; }
    </style>
</head>
<body>
<div class="quiz-paper" id="quizPaper">
    <div class="header">
        <h2>⏣ JHARKHAND CLASS-XI CHEMISTRY (P2) · 2025</h2>
        <div class="sub"><span>40 MCQs · No negative marking</span><span>Time: 1 Hr · Full marks: 40</span></div>
    </div>

    <div id="dynamicMain"></div>
    <div id="confirmModal" class="confirm-modal">
        <div class="confirm-card">
            <p>✔️ Submit and finish test?</p>
            <div class="confirm-actions">
                <button class="conf-btn conf-yes" id="confirmYes">YES</button>
                <button class="conf-btn conf-no" id="confirmNo">CONTINUE</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- 40 questions exactly from the PDF, in sequence, with correct indexing ----------
        const questions = [
            { q: "How many scientific fundamental quantities are given in SI units?",
              opts: ["5", "7", "3", "9"], correct: 1 }, // B
            { q: "The amount of \\(\\mathrm{CO}_2\\) that could be produced when one mole of carbon is burnt in air, is",
              opts: ["22 g", "50 g", "44 g", "56 g"], correct: 2 }, // C
            { q: "The empirical formula of glucose is",
              opts: ["\\(\\mathrm{CH_2O}\\)", "\\(\\mathrm{CHO}\\)", "\\(\\mathrm{C_6H_{12}O_6}\\)", "\\(\\mathrm{C_{12}H_{22}O_{11}}\\)"], correct: 0 },
            { q: "Calculate number of electrons, protons and neutrons in \\(_{35}\\mathrm{Br}^{80}\\).",
              opts: ["35, 45, 35", "35, 35, 45", "35, 36, 45", "36, 35, 45"], correct: 1 },
            { q: "When an electron jumps from 3rd orbit to 2nd orbit, which spectral series is obtained?",
              opts: ["Balmer", "Lyman", "Paschen", "Brackett"], correct: 0 },
            { q: "What will be the wavelength of a ball of mass \\(0.1\\,\\mathrm{kg}\\) moving with \\(10\\,\\mathrm{m/s}\\)?",
              opts: ["\\(6.626\\times10^{-30}\\mathrm{m}\\)", "\\(6.626\\times10^{-32}\\mathrm{m}\\)", "\\(6.626\\times10^{-33}\\mathrm{m}\\)", "\\(6.626\\times10^{-34}\\mathrm{m}\\)"], correct: 3 },
            { q: "Maximum number of electrons in 4d orbital is",
              opts: ["14", "10", "8", "6"], correct: 1 },
            { q: "To which block does \\([\\mathrm{Ar}]4s^1 3d^{10}\\) belong?",
              opts: ["s-block", "p-block", "d-block", "f-block"], correct: 0 },
            { q: "How many groups in the modern periodic table?",
              opts: ["15", "18", "10", "20"], correct: 1 },
            { q: "\\(\\mathrm{O^{2-}, F^-, Na^+, Mg^{2+}}\\) are called",
              opts: ["Isoelectronic species", "Isoneutral species", "Isotopes", "Isobars"], correct: 0 },
            { q: "Which configuration has the highest ionisation energy?",
              opts: ["\\(ns^2 np^3\\)", "\\(ns^2 np^2\\)", "\\(ns^2 np^1\\)", "\\(ns^2 np^6\\)"], correct: 3 },
            { q: "Dipole moment of \\(\\mathrm{BeCl_2}\\) is",
              opts: ["less than zero", "more than zero", "zero", "\\(1.85\\,\\mathrm{D}\\)"], correct: 2 },
            { q: "The bond angle in a linear molecule is",
              opts: ["108°", "180°", "74.5°", "90°"], correct: 1 },
            { q: "Hybridisation of P in \\(\\mathrm{PCl_5}\\) is",
              opts: ["\\(dsp^2\\)", "\\(sp^3d\\)", "\\(sp^2d^2\\)", "\\(spd^3\\)"], correct: 1 },
            { q: "Shape of \\(\\mathrm{NH_3}\\) molecule is",
              opts: ["Square pyramidal", "V-shape", "Trigonal pyramidal", "Tetrahedral"], correct: 2 },
            { q: "For isothermal process, correct condition is",
              opts: ["\\(q = 0\\)", "\\(\\Delta q = 0\\)", "\\(\\Delta T = 0\\)", "\\(T = 0\\)"], correct: 2 },
            { q: "Enthalpies of elements in their standard states are",
              opts: ["unity", "zero", "positive", "negative"], correct: 1 },
            { q: "Given combustion enthalpies (kJ/mol): methane -890.3, graphite -393.5, hydrogen -285.8. Enthalpy of formation of \\(\\mathrm{CH_4(g)}\\) is",
              opts: ["\\(-74.8\\,\\mathrm{kJ\\,mol^{-1}}\\)", "\\(-52.27\\,\\mathrm{kJ\\,mol^{-1}}\\)", "\\(+74.8\\,\\mathrm{kJ\\,mol^{-1}}\\)", "\\(+52.26\\,\\mathrm{kJ\\,mol^{-1}}\\)"], correct: 0 },
            { q: "If \\(\\Delta G < 0\\), the process is",
              opts: ["spontaneous", "in equilibrium", "non-spontaneous", "none of these"], correct: 0 },
            { q: "For \\(\\mathrm{A + B \\rightleftharpoons C + D}\\), equilibrium constant \\(K_c\\) is",
              opts: ["\\([A][B]\\)", "\\([C][A]\\)", "\\(\\frac{[C][D]}{[A][B]}\\)", "\\([A][D]\\)"], correct: 2 },
            { q: "The conjugate acid of \\(\\mathrm{NH_3}\\) is",
              opts: ["\\(\\mathrm{NH_2^-}\\)", "\\(\\mathrm{NH_4^+}\\)", "\\(\\mathrm{NH_2}\\)", "\\(\\mathrm{N_2H_4}\\)"], correct: 1 },
            { q: "Effect of adding \\(\\mathrm{H_2}\\) on \\(2\\mathrm{H_2} + \\mathrm{CO} \\rightleftharpoons \\mathrm{CH_3OH}\\)?",
              opts: ["towards reactants", "no effect", "towards products", "none"], correct: 2 },
            { q: "pH of 0.1 M \\(\\mathrm{NaOH}\\) solution is nearly",
              opts: ["13", "7", "5", "1"], correct: 0 },
            { q: "Oxidation state of S in \\(\\mathrm{H_2SO_4}\\)?",
              opts: ["+2", "+4", "+6", "-2"], correct: 2 },
            { q: "In \\(\\mathrm{CuO(s) + H_2(g) \\rightarrow Cu(s) + H_2O(g)}\\) oxidising agent is",
              opts: ["CuO", "\\(\\mathrm{H_2}\\)", "Cu", "\\(\\mathrm{H_2O}\\)"], correct: 0 },
            { q: "Electrons transferred in \\(\\mathrm{MnO_4^- + 8H^+ \\rightarrow Mn^{2+} + 4H_2O}\\)",
              opts: ["2", "3", "5", "7"], correct: 2 },
            { q: "\\(3\\mathrm{Mg} + \\mathrm{N_2} \\rightarrow \\mathrm{Mg_3N_2}\\) is",
              opts: ["Decomposition", "Combination", "Displacement", "Combustion"], correct: 1 },
            { q: "\\(\\mathrm{CH_3-\\overset{\\cdot}{C}(CH_3)_2}\\) is which free radical?",
              opts: ["Isopropyl", "Phenyl", "Benzyl", "Tert-butyl"], correct: 3 },
            { q: "Ozonolysis of propene gives",
              opts: ["Propan-2-one", "Methanal", "Ethanal and Methanal", "Ethanal and Propanal"], correct: 2 },
            { q: "\\(\\mathrm{CH_3-CH=CH_2 + HBr \\rightarrow A}\\), A is",
              opts: ["2-Bromopropane", "1-Bromopropane", "3-Bromopropane", "Propane"], correct: 0 },
            { q: "The ortho/para directing group among these is",
              opts: ["-COOH", "-CN", "-COCH_3", "-NH_2"], correct: 3 },
            { q: "Reaction for higher alkanes from alkyl halides is",
              opts: ["Wurtz reaction", "Kolbe's reaction", "β-elimination", "Friedel-Crafts acylation"], correct: 0 },
            { q: "Which system is aromatic? (benzene type)",
              opts: ["Cyclopentadienyl anion", "Cyclohexane", "Benzene", "Cyclooctatetraene"], correct: 2 },
            { q: "Fundamental quantities in SI? (repeat safeguard)",
              opts: ["5", "7", "3", "9"], correct: 1 },
            { q: "One mole C burnt → CO₂ mass?",
              opts: ["22 g", "50 g", "44 g", "56 g"], correct: 2 },
            { q: "Glucose empirical formula?",
              opts: ["CH₂O", "CHO", "C₆H₁₂O₆", "C₁₂H₂₂O₁₁"], correct: 0 },
            { q: "₃₅Br⁸⁰ electron/proton/neutron?",
              opts: ["35,45,35", "35,35,45", "35,36,45", "36,35,45"], correct: 1 },
            { q: "Electron 3→2 series?",
              opts: ["Balmer", "Lyman", "Paschen", "Brackett"], correct: 0 },
            { q: "0.1kg ball 10m/s wavelength?",
              opts: ["6.626e-30", "6.626e-32", "6.626e-33", "6.626e-34"], correct: 3 },
            { q: "Maximum e⁻ in 4d?",
              opts: ["14", "10", "8", "6"], correct: 1 }
        ];
        // final 40 (ensure)
        const fullQ = questions.slice(0,40); 

        // state
        let curIdx = 0;
        let responses = new Array(40).fill(null);
        let submitted = false;

        const mainDiv = document.getElementById('dynamicMain');
        const modal = document.getElementById('confirmModal');
        const yesBtn = document.getElementById('confirmYes');
        const noBtn = document.getElementById('confirmNo');

        function renderMath() {
            if (window.MathJax) {
                MathJax.typesetPromise?.();
            }
        }

        function render() {
            if (submitted) {
                let correctCount = 0;
                for (let i=0; i<fullQ.length; i++) {
                    if (responses[i] !== null && responses[i] === fullQ[i].correct) correctCount++;
                }
                mainDiv.innerHTML = `
                    <div class="result-area">
                        <h2>✅ QUIZ SUBMITTED</h2>
                        <div class="score-badge">${correctCount} / ${fullQ.length}</div>
                        <button id="reviewDummy" style="background:#1e3a5f;color:white;border:none;">↻ Start over (refresh)</button>
                    </div>
                `;
                document.getElementById('reviewDummy')?.addEventListener('click', ()=>{
                    submitted = false;
                    responses.fill(null);
                    curIdx = 0;
                    render();
                });
                return;
            }

            const q = fullQ[curIdx];
            const sel = responses[curIdx];
            const progress = ((curIdx+1)/fullQ.length)*100;

            let optsHtml = '';
            for (let i=0; i<q.opts.length; i++) {
                const letter = String.fromCharCode(65+i);
                const checkedAttr = (sel === i) ? 'checked' : '';
                optsHtml += `
                    <div class="opt-item ${sel === i ? 'selected' : ''}" data-opt-index="${i}">
                        <input type="radio" name="opt" value="${i}" id="opt${i}" ${checkedAttr}>
                        <label class="opt-label" for="opt${i}"><strong>${letter}.</strong> ${q.opts[i]}</label>
                    </div>
                `;
            }

            mainDiv.innerHTML = `
                <div class="tracker">
                    <span>Q${curIdx+1} / ${fullQ.length}</span>
                    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%;"></div></div>
                </div>
                <div class="question-block">
                    <div class="q-text">${q.q}</div>
                    <div class="options" id="optionsContainer">${optsHtml}</div>
                </div>
                <div class="nav-buttons">
                    <button id="prevBtn" ${curIdx===0 ? 'disabled' : ''}>◀ Previous</button>
                    <button id="nextBtn">${curIdx===fullQ.length-1 ? 'Last' : 'Next ▶'}</button>
                    <button id="submitBtn" class="submit-btn">Submit</button>
                </div>
                <div class="footer">Select an option · JAC class-11 chemistry (P2)</div>
            `;

            // attach option click
            document.querySelectorAll('.opt-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    const idx = parseInt(el.dataset.optIndex);
                    if (!isNaN(idx)) {
                        responses[curIdx] = idx;
                        render();
                    }
                });
            });

            document.getElementById('prevBtn')?.addEventListener('click', ()=>{
                if (curIdx > 0) { curIdx--; render(); }
            });
            document.getElementById('nextBtn')?.addEventListener('click', ()=>{
                if (curIdx < fullQ.length-1) { curIdx++; render(); }
            });
            document.getElementById('submitBtn')?.addEventListener('click', ()=>{
                modal.style.visibility = 'visible';
                modal.style.opacity = '1';
            });

            renderMath();
        }

        // modal controls
        yesBtn.addEventListener('click', ()=>{
            modal.style.visibility = 'hidden';
            modal.style.opacity = '0';
            submitted = true;
            render();
        });
        noBtn.addEventListener('click', ()=>{
            modal.style.visibility = 'hidden';
            modal.style.opacity = '0';
        });

        // optional: close if click outside modal content? not needed.
        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.visibility = 'hidden';
                modal.style.opacity = '0';
            }
        });

        render();
    })();
</script>
</body>
</html>
